  :root { --ink:#5b4636; --muted:#8a7d6b; --paper:#fffdf5; --green:#dfe7d5; --green-dark:#607454; --sand:#eee8dc; --accent:#e9bd70; --pixel:"Tiny5","Press Start 2P",ui-monospace,"Courier New",monospace; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; }
  body { color:var(--ink); font-family:var(--pixel); font-size:19px; font-synthesis:none; -webkit-font-smoothing:none; font-smooth:never; }
  button, textarea { font:inherit; color:inherit; }
  .hidden { display:none !important; }

  .app { width:min(100%,560px); min-height:100dvh; margin:auto; padding:14px 16px 24px; display:flex; flex-direction:column; gap:10px; user-select:none; -webkit-user-select:none; }
  textarea { user-select:text; -webkit-user-select:text; }

  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .brand { display:flex; align-items:center; gap:8px; font-size:19px; letter-spacing:.08em; }
  .brand-icon { width:32px; height:32px; flex:none; background:#fff; box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); margin:3px 3px 3px 4px; }
  .brand-icon img { width:100%; height:100%; display:block; object-fit:cover; }
  .head-right { display:flex; align-items:center; gap:12px; }
  .step { color:var(--muted); font-size:17px; }
  .snd { width:36px; height:32px; border:0; background:#fff; cursor:pointer; font-size:16px; line-height:1; padding:0; margin:3px;
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); }
  .snd:active { transform:translateY(2px); }
  .snd:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  .progress { height:8px; background:#f1ebde; box-shadow:0 -2px 0 var(--ink),0 2px 0 var(--ink),-2px 0 0 var(--ink),2px 0 0 var(--ink); margin:2px 2px 0; }
  .progress > div { width:0%; height:100%; background:var(--green-dark); transition:width .25s steps(6); }

  /* сцена с котёнком */
  .stage { position:relative; isolation:isolate; flex:1 1 auto; min-height:220px; max-height:430px; display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
    background:radial-gradient(ellipse 62% 30% at 50% 90%, #f1e9d8 0%, #f6f0e4 48%, rgba(255,255,255,0) 74%); }
  .deco { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .mascot { position:relative; width:min(62vw,262px); aspect-ratio:580/640; margin-bottom:8px; }
  .mascot::after { content:""; position:absolute; z-index:-1; left:18%; right:14%; bottom:2px; height:14px; background:radial-gradient(ellipse at center,rgba(91,70,54,.28),rgba(91,70,54,0) 70%); }
  .catbox { position:absolute; inset:0; transform-origin:50% 96%; transition:transform .11s ease-out; animation:breathe 3.4s ease-in-out infinite; }
  .cat { display:block; width:100%; height:100%; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .face, .props { position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; }
  /* движения котёнка под настроение */
  .mascot[data-motion="hop"] .catbox { animation:mHop .9s ease-in-out infinite; }
  .mascot[data-motion="droop"] .catbox { animation:mDroop 3.2s ease-in-out infinite; }
  .mascot[data-motion="sob"] .catbox { animation:mSob .7s ease-in-out infinite; }
  .mascot[data-motion="jolt"] .catbox { animation:mJolt 2.4s ease-in-out infinite; }
  .mascot[data-motion="jitter"] .catbox { animation:mJitter .12s linear infinite alternate; }
  .mascot[data-motion="sway"] .catbox { animation:mSway 1.8s ease-in-out infinite alternate; }
  .mascot[data-motion="nod"] .catbox { animation:mNod 1.2s ease-in-out infinite alternate; }
  .mascot[data-motion="wiggle"] .catbox { animation:mWiggle .38s ease-in-out infinite alternate; }
  .mascot[data-motion="beat"] .catbox { animation:mBeat .8s ease-in-out infinite; }
  .mascot.pop .catbox { animation:pop .35s cubic-bezier(.3,1.6,.5,1); }
  .mascot.react .catbox { animation:react .5s ease-out; }
  .mascot.talking .catbox { animation:none; transform:translateY(0) rotate(.8deg) scale(1.012,.985); }

  .mascot.kiss .catbox { transform-origin:50% 56%; animation:kiss 2.5s ease-in-out forwards; }
  .react-bubble { position:absolute; z-index:3; top:14px; right:max(6%, calc(50% - 175px)); max-width:170px; padding:8px 12px 6px; background:#fff; font-size:18px; line-height:1.2; color:var(--ink);
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); opacity:0; transform:translateY(6px); transition:opacity .18s, transform .18s; pointer-events:none; }
  .react-bubble.on { opacity:1; transform:none; }
  /* 3D-вращение в финале */
  .mascot.spinning { perspective:1200px; }
  .spin-wrap { position:absolute; inset:0; animation:bobS 2.4s ease-in-out infinite; }
  .spin { position:absolute; inset:0; transform-style:preserve-3d; animation:spin 6s linear infinite; }
  .spin img { position:absolute; inset:0; width:100%; height:100%; backface-visibility:visible; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .beat { transform-box:fill-box; transform-origin:center; animation:beat .8s ease-in-out infinite; }
  .tear { animation:tear 1.2s ease-in infinite; }
  .flame { animation:flame .45s ease-in-out infinite alternate; }
  .fly { animation:fly 3.2s linear infinite; }
  .smoke { animation:smokeUp 2.2s ease-in-out infinite; }
  .ring { animation:ringS .38s ease-in-out infinite alternate; }
  .drop-app { animation:dropApp 1.9s ease-in infinite; }
  .steam { animation:steam 2.2s ease-in-out infinite; opacity:0; }
  .float { animation:float 2.4s ease-in infinite; opacity:0; }
  .spark { animation:spark 1.6s ease-in-out infinite; }
  .zz { animation:zz 2.4s ease-in-out infinite; }

  @keyframes float { 0%{opacity:0;transform:translate(var(--x,0),6px)} 25%{opacity:1} 100%{opacity:0;transform:translate(var(--x,0),-26px)} }
  @keyframes spark { 0%,100%{transform:scale(.6) rotate(0);opacity:.6} 50%{transform:scale(1.15) rotate(20deg);opacity:1} }
  @keyframes zz { 0%,100%{opacity:.35;transform:translateY(2px)} 50%{opacity:1;transform:translateY(-4px)} }
  @keyframes mHop { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px) rotate(-1deg)} }
  @keyframes mDroop { 0%,100%{transform:rotate(-2deg) translateY(2px)} 50%{transform:rotate(2.2deg) translateY(5px)} }
  @keyframes mSob { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-3px) scale(1.012,.99)} 55%{transform:translateY(1px)} }
  @keyframes mJolt { 0%,84%,100%{transform:none} 90%{transform:translateY(-14px) scale(.97,1.05)} 95%{transform:translateY(1px) scale(1.03,.97)} }
  @keyframes mJitter { from{transform:translate(-1px,0) rotate(-1.2deg)} to{transform:translate(1px,0) rotate(1.2deg)} }
  @keyframes mSway { from{transform:rotate(-3deg) translateX(-3px)} to{transform:rotate(3deg) translateX(3px)} }
  @keyframes mNod { from{transform:translateY(0) rotate(0)} to{transform:translateY(4px) rotate(1.2deg)} }
  @keyframes mWiggle { from{transform:rotate(-2deg) translateX(-2px)} to{transform:rotate(2deg) translateX(2px)} }
  @keyframes mBeat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.035)} }
  @keyframes react { 0%{transform:translateY(0) scale(1.02,.96)} 35%{transform:translateY(-16px) rotate(-3deg) scale(.98,1.04)} 65%{transform:translateY(0) rotate(2deg) scale(1.02,.97)} 100%{transform:none} }
  @keyframes kiss { 0%{transform:none} 18%{transform:translateY(8px) scale(.94,.97)} 42%{transform:translateY(-34px) scale(2.3)} 52%{transform:translateY(-34px) scale(2.44,2.16)} 64%{transform:translateY(-34px) scale(2.3)} 100%{transform:none} }

  @keyframes bobS { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }
  @keyframes tear { 0%{transform:translateY(-4px);opacity:0} 30%{opacity:1} 100%{transform:translateY(14px);opacity:0} }
  @keyframes flame { from{transform:scaleY(.88)} to{transform:scaleY(1.16)} }
  @keyframes fly { 0%,100%{transform:translate(70px,16px)} 25%{transform:translate(86px,8px)} 50%{transform:translate(78px,0px)} 75%{transform:translate(60px,10px)} }
  @keyframes smokeUp { 0%,100%{transform:translateY(2px);opacity:.9} 50%{transform:translateY(-8px);opacity:.5} }
  @keyframes ringS { from{transform:rotate(-7deg)} to{transform:rotate(7deg)} }

  @keyframes pop { 0%{transform:scale(.9) translateY(8px)} 100%{transform:scale(1) translateY(0)} }

  /* галерея в финале */
  .gal { position:relative; margin:4px; height:min(40vh,290px); background:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); cursor:pointer; }
  .gal img { max-width:100%; max-height:100%; display:block; transition:opacity .45s ease; user-select:none; -webkit-user-drag:none; }
  .gal img.off { opacity:0; }
  .gal-count { margin-top:12px; text-align:center; font-size:16px; color:var(--muted); }
  input.name-in { width:calc(100% - 6px); margin:3px; border:0; background:#fff; padding:12px; font-size:23px; outline:none; color:var(--ink);

  input.name-in:focus { background:#fffef8; box-shadow:0 -3px 0 var(--green-dark),0 3px 0 var(--green-dark),-3px 0 0 var(--green-dark),3px 0 0 var(--green-dark); }
  input.name-in::placeholder { color:#b3a794; }

  /* окно с текстом */
  .dialog { position:relative; margin:22px 4px 0; padding:22px 16px 16px; background:var(--paper);
    box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),0 10px 0 0 rgba(91,70,54,.16); }
  .dialog::before { content:""; position:absolute; inset:5px; pointer-events:none; box-shadow:0 -2px 0 #efe6d2,0 2px 0 #efe6d2,-2px 0 0 #efe6d2,2px 0 0 #efe6d2; }
  .nameplate { position:absolute; top:-21px; left:14px; padding:3px 11px 2px; background:var(--accent); font-size:18px; letter-spacing:.04em;
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); }
  .eyebrow { font-size:15px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .say { min-height:3em; }
  .q-miles { display:block; margin-bottom:8px; font-size:19px; color:var(--green-dark); }
  .q-title { display:block; margin:0; font-size:25px; line-height:1.3; font-weight:400; }
  .q-hint { display:block; margin-top:10px; font-size:19px; line-height:1.4; color:var(--muted); }
  .rest { color:transparent; }
  .nudge { position:absolute; right:14px; bottom:10px; font-size:15px; color:var(--muted); animation:nudge .9s steps(2) infinite; }
  .ready .nudge { display:none; }
  @keyframes nudge { 50%{transform:translateY(3px)} }

  .reveal { margin-top:14px; }
  .typing .reveal { visibility:hidden; opacity:0; }
  .ready .reveal { visibility:visible; opacity:1; transition:opacity .2s; }

  .answers { display:flex; flex-direction:column; gap:12px; padding:4px 4px 2px; }
  .answer, .btn { border:0; cursor:pointer; text-align:left; background:#fff; color:var(--ink);
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); }
  .answer { position:relative; padding:12px 14px 12px 34px; min-height:50px; font-size:21px; line-height:1.3; }
  .answer::before { content:"▶"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:12px; color:var(--green-dark); visibility:hidden; }
  .answer:hover, .answer:focus-visible { background:#f3f6ee; outline:none; }
  .answer:hover::before, .answer:focus-visible::before { visibility:visible; }
  .answer.selected { background:var(--green); }
  .answer.selected::before { visibility:visible; }
  .ready .answer { animation:in .22s both; animation-delay:calc(var(--i,0) * 70ms); }
  @keyframes in { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }

  .field-label { display:block; font-size:17px; margin:2px 0 8px; color:var(--muted); }
  textarea { width:100%; min-height:130px; resize:vertical; border:0; background:#fff; padding:12px; font-size:21px; line-height:1.35; outline:none;
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink),3px 0 0 var(--ink); margin:3px; width:calc(100% - 6px); }
  textarea:focus { background:#fffef8; box-shadow:0 -3px 0 var(--green-dark),0 3px 0 var(--green-dark),-3px 0 0 var(--green-dark),3px 0 0 var(--green-dark); }
  textarea::placeholder { color:#b3a794; }
  .voice-row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:16px 3px 0; }
  .voice-status { font-size:17px; color:var(--muted); line-height:1.4; flex:1 1 140px; }

  .actions { display:flex; gap:14px; margin:22px 3px 0; }
  .btn { padding:12px 16px; min-height:52px; text-align:center; font-size:21px; }
  .btn.secondary { background:var(--sand); }
  .btn.primary { background:var(--green-dark); color:#fff; flex:1; }
  .btn:active:not(:disabled) { transform:translateY(2px); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
  .note { font-size:16px; color:var(--muted); line-height:1.5; margin:16px 3px 0; }

  @media (max-height:720px) { .stage { min-height:170px; } .mascot { width:min(52vw,230px); } }

const Music = (() => {
  let ctx = null, master = null, bus = null, cur = null, timer = 0, nbuf = null;
  const LEVEL = 0.85;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  function noise() {
    if (nbuf && nbuf.sampleRate === ctx.sampleRate) return nbuf;
    const n = Math.floor(ctx.sampleRate * 0.3), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    let s = 1; for (let i = 0; i < n; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
    return (nbuf = b);
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function osc(type, f, t, dur, dest, g) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    o.connect(g); o.start(t); o.stop(t + dur);
    return o;
  }
  // колокольчик / маримба
  function bell(dest, m, t, dur, vol) {
    const f = mtof(m), g = ctx.createGain(), g2 = ctx.createGain();
    env(g, t, 0.006, vol, Math.max(0.3, dur * 1.1));
    g2.gain.value = 0.25;
    osc("sine", f, t, dur + 1.2, dest, g);
    osc("sine", f * 2, t, dur + 1.2, dest, g2); g2.connect(g);
    g.connect(dest);
  }
  // щипок (укулеле)
  function pluck(dest, m, t, dur, vol) {
    const g = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 1700;
    env(g, t, 0.004, vol, Math.max(0.18, dur));
    osc("triangle", mtof(m), t, dur + 0.6, dest, g);
    g.connect(lp); lp.connect(dest);
  }
  function bass(dest, m, t, dur, vol) {
    const g = ctx.createGain();
    env(g, t, 0.012, vol, Math.max(0.2, dur));
    osc("sine", mtof(m), t, dur + 0.6, dest, g);
    g.connect(dest);
  }
  // мягкий «электропиано»
  function epiano(dest, m, t, dur, vol) {
    const f = mtof(m), g = ctx.createGain(), g2 = ctx.createGain(), lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 2400;
    env(g, t, 0.008, vol, Math.max(0.5, dur * 1.3));
    g2.gain.value = 0.18;
    osc("sine", f, t, dur * 1.3 + 1, dest, g);
    osc("sine", f * 3.01, t, dur + 1, dest, g2); g2.connect(g);
    g.connect(lp); lp.connect(dest);
  }
  function pad(dest, notes, t, dur, vol) {
    notes.forEach(m => {
      [-5, 5].forEach(c => {
        const g = ctx.createGain(), lp = ctx.createBiquadFilter(), o = ctx.createOscillator();
        lp.type = "lowpass"; lp.frequency.value = 950;
        o.type = "triangle"; o.frequency.value = mtof(m); o.detune.value = c;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + 0.35);
        g.gain.setValueAtTime(vol, t + dur - 0.3);
        g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.25);
        o.connect(g); g.connect(lp); lp.connect(dest);
        o.start(t); o.stop(t + dur + 0.4);
      });
    });
  }
  function kick(dest, t, vol) {
    const g = ctx.createGain(), o = ctx.createOscillator();
    o.type = "sine"; o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.13);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.25);
  }
  function hiss(dest, t, vol, type, freq, q, dur) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise(); f.type = type; f.frequency.value = freq; f.Q.value = q || 0.7;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.02);
  }

  /* ---------- «городок»: бодрая мелодия в духе уютных игр ---------- */
  const CH = {
    C: { b: 48, t: [60, 64, 67] }, Am: { b: 45, t: [57, 60, 64] }, F: { b: 41, t: [57, 60, 65] },
    G: { b: 43, t: [55, 59, 62] }, Em: { b: 40, t: [55, 59, 64] }
  };
  const TOWN_PROG = ["C", "Am", "F", "G", "C", "Em", "F", "G"];
  // [позиция в восьмых, нота, длина в восьмых]
  const TOWN_MEL = [
    [[0, 76, 1], [1, 79, 1], [2, 81, 2], [4, 79, 1], [5, 76, 1], [6, 74, 2]],
    [[0, 72, 2], [2, 76, 1], [3, 74, 1], [4, 72, 2], [6, 69, 2]],
    [[0, 77, 1], [1, 81, 1], [2, 79, 2], [4, 77, 1], [5, 76, 1], [6, 74, 2]],
    [[0, 74, 2], [2, 67, 1], [3, 71, 1], [4, 74, 4]],
    [[0, 76, 1], [1, 79, 1], [2, 84, 2], [4, 83, 1], [5, 79, 1], [6, 76, 2]],
    [[0, 76, 2], [2, 74, 1], [3, 76, 1], [4, 79, 2], [6, 76, 2]],
    [[0, 81, 1], [1, 79, 1], [2, 77, 1], [3, 76, 1], [4, 74, 2], [6, 72, 2]],
    [[0, 74, 1], [1, 76, 1], [2, 74, 1], [3, 71, 1], [4, 67, 4]]
  ];
  function townLoop(dest, t0) {
    const e = 60 / 100 / 2, bar = e * 8, sw = 0.035;
    TOWN_PROG.forEach((name, i) => {
      const c = CH[name], t = t0 + i * bar, at = p => t + p * e + (p % 2 ? sw : 0);
      bass(dest, c.b, at(0), e * 3, 0.16); bass(dest, c.b + 7, at(4), e * 3, 0.12);
      [2, 6].forEach(p => c.t.forEach((m, k) => pluck(dest, m, at(p) + k * 0.012, e * 1.6, 0.05)));
      TOWN_MEL[i].forEach(([p, m, d]) => bell(dest, m, at(p), d * e, 0.11));
    });
    return bar * 8;
  }

  /* ---------- «лоуфай»: музыка, под которую удобно думать ---------- */
  const LF = [
    { b: 36, t: [60, 64, 67, 71] }, { b: 33, t: [57, 60, 64, 67] }, { b: 38, t: [62, 65, 69, 72] }, { b: 31, t: [55, 59, 62, 65] }
  ];
  const LF_MEL = [
    [[0.5, 76, 1], [2, 79, 1], [3, 74, 0.75]],
    [[0.5, 72, 1], [2, 76, 1.5]],
    [[0.5, 77, 1], [2, 74, 1], [3, 72, 0.75]],
    [[0.5, 71, 1], [2, 74, 1], [3, 77, 0.75]],
    [[0, 79, 1], [1.5, 76, 0.5], [2, 74, 1], [3, 72, 0.75]],
    [[0.5, 69, 1], [2, 72, 1], [3, 76, 0.75]],
    [[0.5, 74, 1], [2, 77, 1.5]],
    [[0.5, 74, 1], [2, 71, 1], [3, 67, 0.75]]
  ];
  function lofiLoop(dest, t0) {
    const beat = 60 / 76, bar = beat * 4, sw = beat * 0.07;
    for (let i = 0; i < 8; i++) {
      const c = LF[i % 4], t = t0 + i * bar, at = p => t + p * beat + ((p * 2) % 2 === 1 ? sw : 0);
      pad(dest, c.t, t, bar, 0.022);
      bass(dest, c.b, t, beat * 1.8, 0.2); bass(dest, c.b, at(2), beat * 1.4, 0.15);
      kick(dest, t, 0.2); kick(dest, at(2.5), 0.12);
      hiss(dest, at(1), 0.05, "bandpass", 2600, 0.8, 0.12); hiss(dest, at(3), 0.05, "bandpass", 2600, 0.8, 0.12);
      for (let k = 0; k < 8; k++) hiss(dest, at(k * 0.5), k % 2 ? 0.013 : 0.02, "highpass", 7500, 0.7, 0.04);
      LF_MEL[i].forEach(([p, m, d]) => epiano(dest, m, at(p), d * beat, 0.07));
    }
    return bar * 8;
  }

  /* ---------- «титры»: светлая победная мелодия (своя, не чужая) ---------- */
  const CR_PROG = ["C", "G", "Am", "F", "C", "G", "F", "G"];
  const CR_MEL = [
    [[0, 79, 1], [1, 76, 1], [2, 79, 1], [3, 84, 3], [6, 83, 1], [7, 79, 1]],
    [[0, 81, 2], [2, 79, 1], [3, 74, 1], [4, 79, 2], [6, 74, 2]],
    [[0, 76, 1], [1, 81, 1], [2, 84, 2], [4, 81, 1], [5, 79, 1], [6, 76, 2]],
    [[0, 77, 2], [2, 81, 2], [4, 79, 1], [5, 77, 1], [6, 76, 2]],
    [[0, 84, 2], [2, 83, 1], [3, 79, 1], [4, 76, 2], [6, 79, 2]],
    [[0, 74, 1], [1, 79, 1], [2, 83, 2], [4, 81, 1], [5, 79, 1], [6, 74, 2]],
    [[0, 77, 1], [1, 81, 1], [2, 84, 2], [4, 81, 2], [6, 77, 2]],
    [[0, 83, 1], [1, 79, 1], [2, 74, 2], [4, 67, 1], [5, 71, 1], [6, 74, 2]]
  ];
  CH.Am = CH.Am || { b: 45, t: [57, 60, 64] };
  function creditsLoop(dest, t0) {
    const e = 60 / 116 / 2, bar = e * 8;
    CR_PROG.forEach((name, i) => {
      const c = CH[name], t = t0 + i * bar, at = p => t + p * e;
      bass(dest, c.b, at(0), e * 2, 0.15); bass(dest, c.b + 7, at(2), e * 2, 0.1); bass(dest, c.b, at(4), e * 2, 0.15); bass(dest, c.b + 12, at(6), e * 2, 0.1);
      [1, 3, 5, 7].forEach(p => c.t.forEach((m, k) => pluck(dest, m, at(p) + k * 0.01, e * 1.2, 0.04)));
      kick(dest, at(0), 0.1); kick(dest, at(4), 0.09);
      hiss(dest, at(2), 0.03, "bandpass", 2600, 0.8, 0.1); hiss(dest, at(6), 0.03, "bandpass", 2600, 0.8, 0.1);
      for (let k = 0; k < 8; k++) hiss(dest, at(k), k % 2 ? 0.008 : 0.012, "highpass", 7500, 0.7, 0.03);
      CR_MEL[i].forEach(([p, m, d]) => { epiano(dest, m, at(p), d * e, 0.06); bell(dest, m + 12, at(p), d * e, 0.02); });
    });
    return bar * 8;
  }

  const TRACKS = { town: townLoop, lofi: lofiLoop, credits: creditsLoop };

  function attach(c) {
    if (ctx === c) return;
    ctx = c; master = null; bus = null; cur = null; nbuf = null;
  }
  function ensureMaster() {
    if (master) return;
    master = ctx.createGain(); master.gain.value = LEVEL;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5200;
    master.connect(lp); lp.connect(ctx.destination);
  }
  function stop(fade) {
    clearTimeout(timer);
    if (bus) {
      const b = bus, f = fade == null ? 0.8 : fade;
      try { b.gain.cancelScheduledValues(ctx.currentTime); b.gain.setValueAtTime(b.gain.value, ctx.currentTime); b.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + f); } catch (e) {}
      setTimeout(() => { try { b.disconnect(); } catch (e) {} }, f * 1000 + 100);
    }
    bus = null; cur = null;
  }
  function play(name, fadeIn) {
    if (!ctx || !TRACKS[name]) return;
    if (cur === name) return;
    stop(0.9);
    ensureMaster();
    cur = name;
    const my = (bus = ctx.createGain());
    my.gain.setValueAtTime(0.0001, ctx.currentTime);
    my.gain.linearRampToValueAtTime(1, ctx.currentTime + (fadeIn == null ? 1.6 : fadeIn));
    my.connect(master);
    let t = ctx.currentTime + 0.12;
    const loop = () => {
      if (bus !== my) return;
      const len = TRACKS[name](my, t);
      t += len;
      timer = setTimeout(loop, Math.max(500, (t - ctx.currentTime - 1.5) * 1000));
    };
    loop();
  }
  return { attach, play, stop, current: () => cur, _tracks: TRACKS, _setCtx: c => { ctx = c; nbuf = null; } };
})();

function loveFx() {

}
function buildSpin(mascot, n) {
  n = n || 24;
  const box = mascot.querySelector(".catbox");
  if (!box) return;
  let layers = "";
  for (let i = 0; i < n; i++) {
    const z = (i - (n - 1) / 2) * 1.15;
    const edge = (i === 0 || i === n - 1);
    layers += `<img src="${SPIN_SRC}" alt="" draggable="false" style="transform:translateZ(${z.toFixed(1)}px);${edge ? "" : "filter:brightness(.8);"}">`;
  }
  const wrap = document.createElement("div");
  wrap.className = "spin-wrap";
  wrap.innerHTML = `<div class="spin">${layers}</div>`;
  box.replaceWith(wrap);
  mascot.classList.add("spinning");
}
function finaleSequence(mascot, hooks) {
  hooks = hooks || {};
  mascot.dataset.motion = "none";
  mascot.classList.add("kiss");
  mascot.querySelector(".face").innerHTML = FACE.blush();
  mascot.querySelector(".props").innerHTML = "";
  const t1 = setTimeout(() => hooks.onKiss && hooks.onKiss(), 1300);
  const t2 = setTimeout(() => {
    mascot.classList.remove("kiss");
    buildSpin(mascot);
    mascot.querySelector(".props").innerHTML = loveFx();
    hooks.onSpin && hooks.onSpin();
  }, 2500);
  return () => { clearTimeout(t1); clearTimeout(t2); };
}

      } else if (navigator.vibrate) navigator.vibrate(kind === "success" ? [15,40,15] : 10);
    } catch(e) {}
  }

  /* ---------- звук ---------- */
  let audio = null, muted = appStore.getItem("kitchen-muted") === "1", lastBlip = 0;
  let wantedTrack = "town";
  function ensureAudio() {
    if (muted) return;
    try {
      if (!audio) { const C = window.AudioContext || window.webkitAudioContext; if (C) { audio = new C(); Music.attach(audio); } }
      if (!audio) return;
      const go = () => { if (!muted && wantedTrack && Music.current() !== wantedTrack) Music.play(wantedTrack); };
      if (audio.state === "suspended") audio.resume().then(go).catch(() => {}); else go();
    } catch(e) {}
  }
  function blip(freq, dur, vol) {
    if (muted || !audio || audio.state !== "running") return;
    try {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime;
      o.type = "square"; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || .03, t0);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + (dur || .05));
      o.connect(g); g.connect(audio.destination);
      o.start(t0); o.stop(t0 + (dur || .05) + .02);
    } catch(e) {}
  }
  function sweep(f1, f2, dur, vol) {
    if (muted || !audio || audio.state !== "running") return;
    try {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime;
      o.type = "sine"; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur + .05);
      o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + dur + .08);
    } catch(e) {}
  }
  function pop(vol) {
    if (muted || !audio || audio.state !== "running") return;
    try {
      const n = Math.floor(audio.sampleRate * .05), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
      let s = 7; for (let i = 0; i < n; i++) { s = (s * 16807) % 2147483647; d[i] = (s / 2147483647) * 2 - 1; }
      const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain(), t0 = audio.currentTime;
      src.buffer = buf; f.type = "bandpass"; f.frequency.value = 1900; f.Q.value = 1.4;
      g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + .045);
      src.connect(f); f.connect(g); g.connect(audio.destination); src.start(t0);
    } catch(e) {}
  }
  // милый «чмок»: «м-у» вверх, хлопок губ, короткий «ля» вниз
  const smooch = () => {
    sweep(520, 1250, .07, .06);
    setTimeout(() => { pop(.16); sweep(1500, 640, .09, .06); }, 105);
    setTimeout(() => sweep(880, 1320, .05, .03), 250);
  };
  const chime = notes => notes.forEach((f, i) => setTimeout(() => blip(f, .08, .035), i * 90));
  function paintSound() {
    sndBtn.textContent = muted ? "🔇" : "🔊";
    sndBtn.setAttribute("aria-pressed", String(!muted));
    sndBtn.setAttribute("aria-label", muted ? "Включить звук" : "Выключить звук");
  }
  sndBtn.addEventListener("click", e => {
    e.stopPropagation();
    muted = !muted;
    appStore.setItem("kitchen-muted", muted ? "1" : "0");
    paintSound();
    if (muted) Music.stop(0.4); else { ensureAudio(); setTimeout(() => chime([523, 659]), 30); }
  });
  paintSound();
  document.addEventListener("visibilitychange", () => {
    if (!audio) return;
    try { if (document.hidden) audio.suspend(); else if (!muted) audio.resume(); } catch(e) {}
  });
  ["pointerdown","click","keydown","touchend"].forEach(ev => document.addEventListener(ev, ensureAudio, { passive:true }));

  /* ---------- котёнок ---------- */
  buildMascot(mascot);
  function setPose(name) {
    setProps(mascot, name);
    mascot.classList.remove("pop"); void mascot.offsetWidth; mascot.classList.add("pop");
    mascot.querySelectorAll(".float").forEach((h, i) => h.style.setProperty("--x", (i - 1) * 6 + "px"));
  }
  let lastReact = -1, bubbleTimer = 0;
  function react() {
    let i; do { i = Math.floor(Math.random() * (REACTIONS.length + (nm() ? 1 : 0))); } while (i === lastReact);
    lastReact = i;
    bubble.textContent = i === REACTIONS.length ? `Спасибо, ${nm()}!` : REACTIONS[i]; bubble.classList.add("on");
    mascot.classList.remove("react"); void mascot.offsetWidth; mascot.classList.add("react");
    clearTimeout(bubbleTimer); bubbleTimer = setTimeout(() => bubble.classList.remove("on"), 1700);
    haptic("select"); chime([660, 880]);
  }

  /* ---------- печатающийся текст ---------- */
  let typing = null;
  const VOWELS = "аеёиоуыэюяaeiouy";
  function stopTyping() {
    if (typing) { clearTimeout(typing.timer); typing = null; }
    mascot.classList.remove("talking","open");
  }
  function finishTyping() { if (typing) typing.finish(); }
  function say(segs, onDone) {
    stopTyping();
    const parts = segs.map(s => {
      s.el.textContent = "";
      const a = document.createElement("span"), b = document.createElement("span");
      b.className = "rest"; b.textContent = s.text;
      s.el.append(a, b);
      return { a, b, text:s.text };
    });
    const flat = parts.map(p => p.text).join("");
    let pos = 0;
    const paint = () => {
      let left = pos;
      for (const p of parts) {
        const n = Math.max(0, Math.min(p.text.length, left));
        p.a.textContent = p.text.slice(0, n); p.b.textContent = p.text.slice(n);
        left -= p.text.length;
      }
    };
    const done = () => {
      clearTimeout(t.timer); pos = flat.length; paint();
      mascot.classList.remove("talking","open");
      screen.classList.remove("typing"); screen.classList.add("ready");
      if (typing === t) typing = null;
      if (onDone) { const f = onDone; onDone = null; f(); }
    };
    const t = { timer:0, finish:done };
    typing = t;
    screen.classList.add("typing"); screen.classList.remove("ready");
    mascot.classList.add("talking");
    paint();
    const tick = () => {
      pos++; paint();
      const ch = flat[pos-1] || "";
      mascot.classList.toggle("open", VOWELS.includes(ch.toLowerCase()));
      const now = Date.now();
      if (/[\p{L}\p{N}]/u.test(ch) && now - lastBlip > 55) { lastBlip = now; blip(380 + (ch.charCodeAt(0) % 9) * 28, .04, .02); }
      if (pos >= flat.length) return done();
      let d = 30;
      if (/[.!?…]/.test(ch)) d += 190; else if (/[,;:]/.test(ch)) d += 90;
      t.timer = setTimeout(tick, d);
    };
    t.timer = setTimeout(tick, 280);
  }
  function speak(titleText, hintText, milesText, onDone) {
    text.classList.toggle("hidden", !hintText);
    miles.classList.toggle("hidden", !milesText);
    const segs = [];
    if (milesText) segs.push({ el:miles, text:milesText });
    segs.push({ el:title, text:titleText });
    if (hintText) segs.push({ el:text, text:hintText });
    say(segs, onDone);
  }
  // пропуск набора: пробел или касание по экрану
  document.addEventListener("keydown", e => {
    if (typing && (e.code === "Space" || e.key === " ")) { e.preventDefault(); finishTyping(); }
  });
  document.addEventListener("pointerdown", () => { if (typing) finishTyping(); });

  /* ---------- сохранение прогресса ---------- */
  function hasAnswer() {
    const q = questions[state.index];
    if (!q) return true;
    const a = state.answers[q.id];
    return !!(a && String(a.value ?? "").trim() !== "");
  }
  function updateNext() {
    nextBtn.disabled = state.index >= 0 && state.index < questions.length && !hasAnswer();
  }
  function saveLocal() {
    try { appStore.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  }
  function loadLocal() {
    try {
      const saved = JSON.parse(appStore.getItem(KEY) || "null");
      if (saved && typeof saved === "object") {
        state.index = Number.isInteger(saved.index) ? saved.index : -1;
        state.answers = saved.answers || {};
        state.sent = saved.sent || {};
        state.name = typeof saved.name === "string" ? saved.name.slice(0, 30) : "";
      }
    } catch(e) {}
  }
  function clearSaved() {
    try { appStore.removeItem(KEY); appStore.removeItem("session_id"); } catch(e) {}
  }

  /* ---------- экраны ---------- */
  function setButtons(next, back, backLabel) {
    nextBtn.textContent = next;
    backBtn.textContent = backLabel || "Назад";
    backBtn.classList.toggle("hidden", !back);
  }
  function renderWelcome() {
    state.index = -1; pendingResume = null; nameMode = false;
    $("stepLabel").textContent = "Знакомство";
    $("progressFill").style.width = "0%";
    $("eyebrow").textContent = "Знакомство";
    answerArea.innerHTML = "";
    setPose("hello");
    speak("Мяу! Я котёнок-поваренок.", "Хочу узнать, как ты решаешь, что поесть, как готовишь и покупаешь продукты и что в этом даётся тяжелее всего. Правильных ответов нет, рассказывай как есть. Отвечать нужно на все вопросы.");
    setButtons("Начать", false);
    nextBtn.disabled = false;
    $("privacyNote").classList.remove("hidden");
    $("privacyNote").textContent = NOTE;
  }
  function renderName() {
    nameMode = true;
    $("stepLabel").textContent = "Знакомство";
    $("progressFill").style.width = "0%";
    $("eyebrow").textContent = "Знакомство";
    answerArea.innerHTML = "";
    setPose("hello");
    speak("Как тебя зовут?", "Хочу обращаться по имени, так будет веселее.");
    const inp = document.createElement("input");
    inp.type = "text"; inp.className = "name-in"; inp.id = "nameInput"; inp.maxLength = 30;
    inp.placeholder = "Твоё имя"; inp.autocomplete = "off"; inp.value = state.name || "";
    inp.setAttribute("aria-label", "Твоё имя");
    inp.addEventListener("input", () => { state.name = inp.value; nextBtn.disabled = !inp.value.trim(); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && inp.value.trim()) { e.preventDefault(); nextBtn.click(); } });
    answerArea.appendChild(inp);
    setButtons("Дальше", true, "Назад");
    nextBtn.disabled = !inp.value.trim();
    $("privacyNote").classList.remove("hidden");
    $("privacyNote").textContent = "Имя нужно только для разговора с котёнком. Оно остаётся на твоём устройстве и в таблицу не отправляется.";
  }
  function renderResume(n) {
    $("stepLabel").textContent = "С возвращением";
    $("progressFill").style.width = `${(n/questions.length)*100}%`;
    $("eyebrow").textContent = "Знакомство";
    answerArea.innerHTML = "";
    setPose("hello");
    speak(`Мяу! Ты вернулся${nm() ? ", " + nm() : ""}!`, `Ты остановился на вопросе ${n+1} из ${questions.length}. Продолжим с этого места?`);
    setButtons("Продолжить", true, "Начать заново");
    nextBtn.disabled = false;
    $("privacyNote").classList.remove("hidden");
    $("privacyNote").textContent = "Если начнёшь заново, уже отправленные ответы в таблице останутся.";
  }
  function renderQuestion() {
    nameMode = false;
    const q = questions[state.index];
    if (!q) return renderFinish();
    $("stepLabel").textContent = `${state.index+1} из ${questions.length}`;
    $("progressFill").style.width = `${((state.index+1)/questions.length)*100}%`;
    $("eyebrow").textContent = q.section;
    answerArea.innerHTML = "";
    setPose(POSE[q.id] || "think");
    const ms = greet || (MILES[state.index+1] ? MILES[state.index+1]() : "");
    greet = "";
    speak(q.title, q.text, ms);
    if (q.kind === "single") {
      const wrap = document.createElement("div"); wrap.className = "answers";
      (q.options || []).forEach((option, i) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = "answer"; b.textContent = option; b.style.setProperty("--i", i);
        b.setAttribute("aria-pressed", String(state.answers[q.id]?.value === option));
        if (state.answers[q.id]?.value === option) b.classList.add("selected");
        b.addEventListener("click", () => {
          state.answers[q.id] = { question_id:q.id, answer_type:"choice", value:option, answered_at:new Date().toISOString() };
          wrap.querySelectorAll("button").forEach(btn => { btn.classList.remove("selected"); btn.setAttribute("aria-pressed","false"); });
          b.classList.add("selected"); b.setAttribute("aria-pressed","true");
          saveLocal();
          updateNext();
          react();
        });
        wrap.appendChild(b);
      });
      answerArea.appendChild(wrap);
    } else {
      const label = document.createElement("label"); label.className = "field-label"; label.htmlFor = "freeAnswer"; label.textContent = "Твой ответ";
      const ta = document.createElement("textarea"); ta.id = "freeAnswer"; ta.placeholder = q.placeholder || "Напиши ответ…"; ta.maxLength = 2000;
      ta.value = state.answers[q.id]?.value || "";
      ta.addEventListener("input", () => {
        state.answers[q.id] = { question_id:q.id, answer_type:"text", value:ta.value, answered_at:new Date().toISOString() };
        saveLocal();
        updateNext();
      });
      answerArea.append(label, ta);

      const voiceRow = document.createElement("div"); voiceRow.className = "voice-row";
      const voiceBtn = document.createElement("button");
      voiceBtn.type = "button"; voiceBtn.className = "btn secondary";
      voiceBtn.textContent = "🎤 Дать интервью";
      const voiceStatus = document.createElement("span"); voiceStatus.className = "voice-status";

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceStatus.textContent = "Голосовой ввод не поддерживается в этом браузере. Напишите ответ текстом.";
      } else {
        voiceBtn.addEventListener("click", () => {
          const recognition = new SpeechRecognition();
          recognition.lang = "ru-RU";
          recognition.interimResults = false;
          voiceStatus.textContent = "Слушаю…";
          recognition.onresult = (event) => {
            const spokenText = event.results[0][0].transcript;
            ta.value = ta.value ? ta.value + " " + spokenText : spokenText;
            ta.dispatchEvent(new Event("input", { bubbles: true }));
            voiceStatus.textContent = "Проверьте текст перед отправкой.";
          };
          recognition.onerror = () => {
            voiceStatus.textContent = "Не удалось распознать речь. Попробуйте ещё раз.";
          };
          try {
            recognition.start();
          } catch (e) {
            voiceStatus.textContent = "Не удалось включить микрофон. Попробуйте ещё раз.";
          }
        });
      }
      voiceRow.append(voiceBtn, voiceStatus);
      answerArea.append(voiceRow);
    }
    setButtons(state.index === questions.length-1 ? "Завершить" : "Дальше", true, "Назад");
    updateNext();
    $("privacyNote").classList.remove("hidden");
    $("privacyNote").textContent = NOTE;
  }
  function startGallery() {
    answerArea.innerHTML = "";
    const box = document.createElement("div"); box.className = "gal";
    const img = document.createElement("img"); img.alt = ""; img.draggable = false;
    const cnt = document.createElement("div"); cnt.className = "gal-count";
    let i = 0;
    const paint = () => { img.src = GAL[i]; cnt.textContent = `${i+1} / ${GAL.length}`; };
    const next = () => {
      img.classList.add("off");
      setTimeout(() => { i = (i + 1) % GAL.length; paint(); img.classList.remove("off"); }, 460);
    };
    const arm = () => { clearInterval(galTimer); galTimer = setInterval(next, 3600); };
    paint(); box.appendChild(img);
    box.addEventListener("click", () => { next(); arm(); });
    answerArea.append(box, cnt);
    arm();
  }
  function renderFinish() {
    nameMode = false;
    $("stepLabel").textContent = "Готово";
    $("progressFill").style.width = "100%";
    $("eyebrow").textContent = "Спасибо за участие";
    answerArea.innerHTML = "";
    wantedTrack = null; Music.stop(1.4);
    mascot.classList.remove("pop","react","talking","open");
    bubble.classList.remove("on"); clearTimeout(bubbleTimer);
    setPose("hello");
    setButtons("Закрыть", false);
    nextBtn.disabled = false;
    $("privacyNote").classList.add("hidden");
    const toGallery = () => {
      speak("Это тебе в подарок!", "В благодарность небольшая подборка крутых картинок лично от меня.", null, () => setTimeout(startGallery, 250));
    };
    const doKiss = () => {
      cancelFinale = finaleSequence(mascot, {
        onKiss: () => { smooch(); haptic("success"); },
        onSpin: () => { wantedTrack = "credits"; if (!muted && audio) ensureAudio(); chime([784, 1047]); setTimeout(toGallery, 2000); }
      });
    };
    speak(`Спасибо${nm() ? ", " + nm() : ""}!`, "Мне было очень интересно тебя слушать. Все ответы у меня. Чмок!", null, () => setTimeout(doKiss, 450));
  }

  let busy = false;
  nextBtn.addEventListener("click", async () => {
    if (busy) return;
    haptic("light");
    if (pendingResume !== null) {
      state.index = pendingResume; pendingResume = null;
      renderQuestion();
      return;
    }
    if (nameMode) {
      const v = (document.getElementById("nameInput") || {}).value || "";
      if (!v.trim()) return;
      state.name = v.trim().slice(0, 30);
      greet = `Приятно познакомиться, ${state.name}!`;
      state.index = 0;
      renderQuestion();
      saveLocal();
      return;
    }
    if (state.index === -1) {
      renderName();
      return;
    }

    if (state.index >= questions.length) {
      const w = tg();
      if (w && w.close) w.close(); else window.close();
      setTimeout(() => { nextBtn.textContent = "Можно закрыть эту страницу"; nextBtn.disabled = true; }, 400);
      return;
    }

    const q = questions[state.index];
    const answer = state.answers[q.id];

    if (!hasAnswer()) return;
    if (q.kind === "text") react();
    blip(520, .05, .03);

    busy = true;
    try {
      if (state.sent[q.id] !== answer.value) {
        await sendAnswerToGoogle(
          q.id,
          q.title,
          answer.answer_type,
          answer.value
        );
        state.sent[q.id] = answer.value;
      }
    } finally {
      busy = false;
    }

    state.index += 1;

    if (state.index >= questions.length) {
      clearSaved();
      renderFinish();
      return;
    }

    renderQuestion();
    saveLocal();
  });

  backBtn.addEventListener("click", () => {
    if (nameMode) { renderWelcome(); return; }
    if (pendingResume !== null) {
      state.answers = {}; state.sent = {};
      clearSaved();
      renderWelcome();
      return;
    }
    if (state.index > 0) { state.index -= 1; renderQuestion(); saveLocal(); }
    else if (state.index === 0) { renderName(); saveLocal(); }
  });

  loadLocal();
  if (state.index >= 0 && state.index < questions.length) {
    pendingResume = state.index; state.index = -1;
    renderResume(pendingResume);
  } else {
    state.index = -1;
    renderWelcome();
  }
})();
</script>
<script>
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiIIgnfZXJPs43Q_Fq4VHug_ZTqHluuUYF4xtAvvBV4PMDgrKtcRnx_8utthtSk-LD6w/exec';
  
  async function sendAnswerToGoogle(questionId, question, answerType, answerText) {
    const sessionId = appStore.getItem('session_id') ||
      (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  
    appStore.setItem('session_id', sessionId);
  
    const payload = {
      session_id: sessionId,
      submitted_at: new Date().toISOString(),
      question_id: questionId,
      question: question,
      answer_type: answerType,
      answer_text: answerText
    };
  
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(payload)
      });
  
      console.log('Ответ отправлен на сохранение');
    } catch (error) {
      console.error('Не удалось отправить ответ:', error);
    }
  }
</script>
